name: Pruebas unitarias

# Las pruebas del backend corren en cada push y en cada pull request hacia main/develop,
# de modo que un fallo se ve en GitHub antes de mezclar la rama.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (dotnet test)
    # windows-latest: la guarda de compilación del .csproj de la API usa tasklist, propio de Windows.
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar
        run: dotnet build backend/SistemaInventario.sln -c Release --nologo

      - name: Ejecutar las pruebas unitarias
        run: >
          dotnet test backend/SistemaInventario.sln
          -c Release --no-build --nologo
          --logger "console;verbosity=normal"
